openapi: 3.0.3
info:
  title: Path parameters that sanitize to the same wildcard name
  version: 1.0.0
paths:
  /users/{user-id}/{user_id}:
    get:
      operationId: getUser
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
